<title>Noir Capital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Layout: one-screen phone app. Sticky balance bar, scrolling stage, bottom dock.
   Each district (home / casino / terminal / maison) re-skins the same tokens. */
:root{
  --bg:#060608; --panel:#0f0f14; --panel2:#16161d; --line:#23232e;
  --txt:#efeef6; --mute:#7f7d93; --acc:#b9a6ff; --acc2:#62e3ff;
  --up:#2fe3a4; --dn:#ff4f6e; --gold:#e8cf96;
  --glow:rgba(160,130,255,.35);
  --f-disp:'Syne',system-ui,sans-serif;
  --f-body:'Inter Tight',system-ui,-apple-system,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --f-lux:'Cormorant Garamond','Times New Roman',serif;
  --r:16px;
  color-scheme:dark;
}
#app[data-zone=casino]{--bg:#0a0918;--panel:#13112a;--panel2:#1b1838;--line:#2a2650;--acc:#8b6cff;--acc2:#4ff0d0;--glow:rgba(139,108,255,.45);--mute:#8a85b5}
#app[data-zone=trade]{--bg:#040506;--panel:#0b0d0f;--panel2:#111417;--line:#1b1f24;--acc:#2fe3a4;--acc2:#7af0ff;--glow:rgba(47,227,164,.25);--mute:#6b7480}
#app[data-zone=shop]{--bg:#0b0a08;--panel:#131210;--panel2:#1a1815;--line:#2b2822;--acc:#e8cf96;--acc2:#fff3d6;--glow:rgba(232,207,150,.22);--mute:#8f8878;--txt:#f3eee3}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#060608;color:var(--txt);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;font-size:16px;color:var(--txt)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden;transition:background .5s}
#aura{position:absolute;inset:-30% -30% auto;height:70%;pointer-events:none;filter:blur(60px);opacity:.55;transition:opacity .6s;
  background:radial-gradient(40% 50% at 30% 50%,var(--glow),transparent 70%),radial-gradient(35% 45% at 75% 40%,color-mix(in srgb,var(--acc2) 25%,transparent),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(8%,6%,0) rotate(8deg)}}

/* top bar */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-disp);font-weight:800;letter-spacing:.04em;font-size:15px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 0deg,var(--acc),var(--acc2),#ff7ad9,var(--acc));animation:spin 6s linear infinite;box-shadow:0 0 18px var(--glow)}
@keyframes spin{to{transform:rotate(360deg)}}
.bal{margin-left:auto;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:color-mix(in srgb,var(--panel2) 85%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px)}
.bal b{font-family:var(--f-num);font-size:15px;font-weight:700}
.bal .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 10px var(--up)}
.bal.flash-up{animation:fu .6s}.bal.flash-dn{animation:fd .6s}
@keyframes fu{30%{border-color:var(--up);box-shadow:0 0 22px color-mix(in srgb,var(--up) 50%,transparent)}}
@keyframes fd{30%{border-color:var(--dn);box-shadow:0 0 22px color-mix(in srgb,var(--dn) 50%,transparent)}}

main{position:relative;z-index:2;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px}
.view{animation:vin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(14px) scale(.985)}}

/* dock */
nav.dock{position:relative;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px;padding-right:max(12px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.04em;transition:color .25s,transform .2s}
.dock button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.dock button.on{color:var(--txt)}
.dock button.on svg{transform:translateY(-2px) scale(1.12);filter:drop-shadow(0 0 8px var(--acc))}
.dock button:active{transform:scale(.92)}

/* generic */
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:700;letter-spacing:.02em;background:var(--acc);color:#0b0a14;transition:transform .15s,filter .2s,box-shadow .3s;box-shadow:0 8px 30px -8px var(--glow);position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--panel2);color:var(--txt);box-shadow:none;border:1px solid var(--line)}
.btn.ghost::after{display:none}
.btn.red{background:var(--dn);color:#fff}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);transition:all .2s}
.chip.on{color:var(--txt);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 16%,var(--panel2))}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.pills::-webkit-scrollbar{display:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.inp{display:flex;align-items:center;height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:0 4px 0 12px;gap:4px;min-width:0}
.inp input{flex:1;min-width:0;background:none;border:0;outline:0;font-family:var(--f-num);font-weight:700}
.inp span{color:var(--mute);font-family:var(--f-num)}
.inp button{height:36px;min-width:38px;padding:0 8px;border-radius:9px;background:color-mix(in srgb,var(--txt) 7%,transparent);font-size:12px;font-weight:700}
.inp button:active{transform:scale(.92)}
select.sel{height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:0 12px;width:100%}
.up{color:var(--up)}.dn{color:var(--dn)}.mute{color:var(--mute)}

/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.toast{padding:10px 16px;border-radius:14px;background:rgba(20,20,28,.92);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);font-size:13px;font-weight:600;color:#efeef6;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tin .4s cubic-bezier(.2,1.4,.4,1);max-width:100%}
.toast.good{border-color:rgba(47,227,164,.5)}.toast.bad{border-color:rgba(255,79,110,.5)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#bigwin{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
#bigwin div{font-family:var(--f-disp);font-weight:800;font-size:clamp(40px,14vw,88px);line-height:.9;text-align:center;background:linear-gradient(180deg,#fff,#ffe08a 45%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,190,80,.6));animation:bw 1.9s cubic-bezier(.2,1.3,.3,1) forwards}
#bigwin small{display:block;font-size:.28em;letter-spacing:.2em;margin-top:8px}
@keyframes bw{0%{opacity:0;transform:scale(.3) rotate(-8deg)}20%{opacity:1;transform:scale(1.08)}75%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:sup .42s cubic-bezier(.2,1,.3,1)}
.sheet.out{animation:sdown .28s forwards}.sheet-bg.out{animation:fade .28s reverse forwards}
@keyframes sup{from{transform:translateY(100%)}}
@keyframes sdown{to{transform:translateY(100%)}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}

/* ============ HOME ============ */
.hero{padding:18px 0 6px;display:flex;flex-direction:column;gap:6px}
.hero .nw{font-family:var(--f-disp);font-weight:800;font-size:clamp(38px,12vw,64px);letter-spacing:-.02em;line-height:1;background:linear-gradient(100deg,#fff 20%,var(--acc) 50%,var(--acc2) 80%,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:-200% 0}}
.rank{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rank i{width:8px;height:8px;border-radius:2px;background:var(--acc);transform:rotate(45deg);box-shadow:0 0 12px var(--acc)}
.prog{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;margin-top:6px}
.prog b{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:9px;transition:width .8s}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-num);font-size:17px}
.stat span{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.portals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.portal{position:relative;height:118px;border-radius:20px;padding:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(255,255,255,.07);transition:transform .2s}
.portal:active{transform:scale(.97)}
.portal h3{font-family:var(--f-disp);font-size:clamp(14px,4.4vw,19px);font-weight:800;position:relative}
.portal p{margin:2px 0 0;font-size:12px;opacity:.75;position:relative}
.portal::before{content:"";position:absolute;inset:0;opacity:.95}
.portal.p1::before{background:radial-gradient(120% 90% at 100% 0,#8b6cff,transparent 60%),linear-gradient(160deg,#1b1640,#0b0a1c)}
.portal.p2::before{background:radial-gradient(120% 90% at 100% 0,#13c58a,transparent 55%),linear-gradient(160deg,#0b1a16,#040606)}
.portal.p3::before{background:radial-gradient(120% 90% at 100% 0,#c9a45f,transparent 55%),linear-gradient(160deg,#1f1a12,#0b0a08)}
.portal.p4::before{background:radial-gradient(120% 90% at 100% 0,#ff5fa2,transparent 55%),linear-gradient(160deg,#241226,#0c070d)}
.portal .big{position:absolute;right:-6px;top:-14px;font-family:var(--f-disp);font-weight:800;font-size:76px;opacity:.12;line-height:1}
.coll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.coll::-webkit-scrollbar{display:none}
.coll .it{flex:0 0 130px;border-radius:16px;padding:10px;background:var(--panel);border:1px solid var(--line)}
.coll .it .art{height:64px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.coll .it .art svg{width:70%;height:70%}
.coll .it b{display:block;font-size:12px;line-height:1.2}
.coll .it span{font-size:11px;color:var(--mute)}
.sec{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.sec-h h2{font-family:var(--f-disp);font-size:18px;font-weight:700}

/* ============ CASINO ============ */
.ticker{overflow:hidden;border-radius:12px;background:var(--panel);border:1px solid var(--line);height:34px;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.ticker .tr{display:flex;gap:22px;white-space:nowrap;animation:tick 40s linear infinite;font-size:12px;padding-left:100%}
.ticker .tr span b{color:var(--acc2);font-family:var(--f-num)}
@keyframes tick{to{transform:translateX(-100%)}}
.cas-h{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 0 10px}
.cas-h h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(22px,7vw,30px);letter-spacing:-.02em}
.cas-h h1 em{font-style:normal;color:var(--acc)}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gcard{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;text-align:left;border:1px solid rgba(255,255,255,.08);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.gcard:active{transform:scale(.94)}
.gcard .bgc{position:absolute;inset:0}
.gcard .gl{position:absolute;left:0;right:0;top:12%;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:38px;color:rgba(255,255,255,.92);text-shadow:0 0 24px rgba(255,255,255,.4);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.gcard b{position:relative;font-family:var(--f-disp);font-size:clamp(11px,3.4vw,14px);overflow-wrap:anywhere;font-weight:800;letter-spacing:.02em}
.gcard small{position:relative;font-size:10px;opacity:.7;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.gcard::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%);background-size:250% 100%;animation:foil 4s linear infinite}
@keyframes foil{from{background-position:150% 0}to{background-position:-100% 0}}
.ghead{display:flex;align-items:center;gap:10px;padding:10px 0 12px}
.back{width:38px;height:38px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
.back svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2}
.ghead h2{font-family:var(--f-disp);font-weight:800;font-size:22px}
.game{display:flex;flex-direction:column;gap:12px}
.stage{position:relative;border-radius:20px;background:radial-gradient(120% 80% at 50% 0,color-mix(in srgb,var(--acc) 16%,var(--panel)),var(--panel));border:1px solid var(--line);overflow:hidden;min-height:220px}
.ctrl{display:flex;flex-direction:column;gap:10px}
.mult-big{font-family:var(--f-disp);font-weight:800;font-size:clamp(44px,15vw,72px);letter-spacing:-.02em;text-align:center}
.hist{display:flex;gap:5px;overflow:hidden;padding:10px}
.hist span{font-family:var(--f-num);font-size:11px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.06);animation:tin .3s}
.hist span.w{color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,transparent)}
.hist span.l{color:var(--dn)}

/* crash */
.crash canvas{display:block;width:100%;height:240px}
.crash .mult-big{position:absolute;left:0;right:0;top:38%;transform:translateY(-50%);pointer-events:none;transition:color .2s}
.crash .hist{position:absolute;top:0;left:0;right:0}
/* mines/towers */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:12px}
.tile{aspect-ratio:1;max-width:100%;border-radius:12px;background:linear-gradient(180deg,#2c2758,#211d45);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s,background .3s}
.tile:active{transform:scale(.9)}
.tile.gem{background:radial-gradient(circle,#2bffd0 0,#0f6f63 70%);animation:pop .4s cubic-bezier(.2,1.8,.4,1);box-shadow:0 0 20px rgba(43,255,208,.5)}
.tile.bomb{background:radial-gradient(circle,#ff6b81,#5a0f1f 70%);animation:pop .4s}
.tile.dim{opacity:.4}
.tile svg{width:55%;height:55%}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.tw{display:flex;flex-direction:column-reverse;gap:6px;padding:12px}
.tw .twr{display:grid;gap:6px;opacity:.5;transition:opacity .3s}
.tw .twr.act{opacity:1}
.tw .twr.act .tile{box-shadow:0 0 0 2px var(--acc),inset 0 -4px 0 rgba(0,0,0,.35)}
.tw .tile{aspect-ratio:auto;height:34px}
/* dice */
.dtrack{position:relative;height:12px;border-radius:9px;margin:30px 18px 10px}
.dmark{position:absolute;top:-38px;transform:translateX(-50%);transition:left .6s cubic-bezier(.3,1.4,.5,1);font-family:var(--f-num);font-weight:700;font-size:13px;padding:5px 8px;border-radius:9px;background:#fff;color:#111}
.dmark::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);width:9px;height:9px;background:inherit}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;background:transparent;height:30px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:9px;background:#fff;box-shadow:0 0 0 4px var(--acc);margin-top:-9px}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:9px;background:var(--panel2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:9px;background:#fff;border:3px solid var(--acc)}
/* cards */
.felt{background:radial-gradient(120% 90% at 50% 0,#17604a,#0a2a22);padding:16px 12px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.hand{display:flex;justify-content:center;min-height:96px}
.hand .pc{margin-left:-22px}.hand .pc:first-child{margin-left:0}
.pc{width:66px;height:94px;border-radius:10px;background:#fbfaf6;color:#15151a;display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;font-family:var(--f-disp);font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.35);animation:deal .45s cubic-bezier(.2,1.2,.4,1)}
.pc.r{color:#d0263f}
.pc span{font-size:18px;line-height:1}
.pc i{font-style:normal;font-size:26px;align-self:flex-end;line-height:1}
.pc.back{background:repeating-linear-gradient(45deg,#6c4cff 0 6px,#4c33c9 6px 12px);border:3px solid #fff}
.pc.back *{display:none}
@keyframes deal{from{opacity:0;transform:translate(60px,-60px) rotate(25deg)}}
.lbl{text-align:center;font-size:12px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.75)}
.lbl b{font-family:var(--f-num);background:rgba(0,0,0,.3);padding:2px 8px;border-radius:7px;margin-left:4px}
/* roulette */
.wheelwrap{position:relative;width:min(250px,70vw);aspect-ratio:1;margin:18px auto}
.wheelwrap canvas{width:100%;height:100%;border-radius:50%;transition:transform 4.2s cubic-bezier(.12,.6,.1,1);box-shadow:0 0 0 6px #2b1f12,0 0 0 9px #c9a45f,0 20px 60px rgba(0,0,0,.6)}
.wheelwrap .ptr{position:absolute;left:50%;top:-12px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));z-index:2}

<script>
(()=>{
'use strict';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const rnd=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function fmt(n,full){const a=Math.abs(n),s=n<0?'-':'';
  if(a>=1e12)return s+'$'+(a/1e12).toFixed(2)+'T';if(a>=1e9)return s+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(2)+'M';
  if(a>=1e4&&!full)return s+'$'+(a/1e3).toFixed(1)+'K';return s+'$'+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
const SUB='₀₁₂₃₄₅₆₇₈₉';
function fmtP(p){if(p>=1)return '$'+p.toFixed(3);if(p>=0.001)return '$'+p.toFixed(5);const z=Math.floor(-Math.log10(p));let sig=Math.round(p*10**(z+3));if(sig>=1000)sig=999;return '$0.0'+String(z).split('').map(d=>SUB[d]).join('')+sig}
const pct=x=>(x>=0?'+':'')+(x*100).toFixed(1)+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};

/* ---------- state & save ---------- */
const KEY='noircap.v1';
const DEF=()=>({v:1,cash:10000,bet:10,owned:{},pos:{},coins:[],stats:{w:0,won:0,best:0,bestM:0,games:0,rugs:0,launched:0,peak:10000},daily:0,t:Date.now(),qb:100});
let S=DEF();
function merge(d){const b=DEF();return Object.assign(b,d,{stats:Object.assign(b.stats,d.stats||{})})}
try{const raw=localStorage.getItem(KEY);if(raw)S=merge(JSON.parse(raw))}catch(e){}
let saveT=0,dirty=false;
function save(){dirty=true;clearTimeout(saveT);saveT=setTimeout(()=>{S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},400)}
/* cloud save: per-player private doc, so progress follows you across devices */
let cloudRef=null,cloudBusy=false;
async function cloudInit(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc('data/users/'+id+'/save');
    const snap=await Promise.race([ref.get(),new Promise((_,j)=>setTimeout(()=>j('timeout'),10000))]);
    if(snap.exists){const d=snap.data();if(d&&typeof d.s==='string'){const cs=JSON.parse(d.s);if((cs.t||0)>(S.t||0)+2000){S=merge(cs);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}toast('Cloud save loaded','good');updBal(true);go(cur,true)}}}
    cloudRef=ref;dirty=true;cloudPush();
  }catch(e){}
}
async function cloudPush(){
  if(!cloudRef||cloudBusy||!dirty)return;cloudBusy=true;dirty=false;
  try{S.t=Date.now();await cloudRef.set({s:JSON.stringify(S),t:S.t})}catch(e){dirty=true}
  cloudBusy=false;
}
setInterval(cloudPush,20000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudPush()}});

/* ---------- money ---------- */
let shown=S.cash,balRaf=0;
function updBal(instant){
  const el=$('#balv'),target=S.cash,from=shown;cancelAnimationFrame(balRaf);
  if(instant){shown=target;el.textContent=fmt(target,target<1e6);return}
  const t0=performance.now(),d=500;
  const f=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,3);shown=from+(target-from)*e;el.textContent=fmt(shown,shown<1e6);if(k<1)balRaf=requestAnimationFrame(f)};
  balRaf=requestAnimationFrame(f);
  const b=$('#bal');b.classList.remove('flash-up','flash-dn');void b.offsetWidth;if(target!==from)b.classList.add(target>from?'flash-up':'flash-dn');
}
function spend(x){if(!(x>0)||x>S.cash+1e-9){toast('Not enough cash','bad');$('#bal').classList.add('shake');setTimeout(()=>$('#bal').classList.remove('shake'),500);return false}S.cash-=x;updBal();save();return true}
function earn(x){S.cash+=x;updBal();save()}
function bet(x){if(!(x>=0.01)){toast('Set a bet first','bad');return false}if(!spend(x))return false;S.stats.w+=x;S.stats.games++;return true}
function win(amount,b,mult){
  earn(amount);S.stats.won+=amount;const profit=amount-b;
  if(profit>S.stats.best)S.stats.best=profit;if(mult>S.stats.bestM)S.stats.bestM=mult;
  if(mult>=10||profit>=Math.max(50000,S.cash*0.25))bigWin(mult,amount);else if(mult>=2)burst(innerWidth/2,innerHeight*.45,30);
  vib(30);
}
function netWorth(){return S.cash+assetValue()+posValue()}
function assetValue(){let v=0;for(const id in S.owned){const it=ITEM[id];if(it)v+=it.p*S.owned[id]}return v}
function posValue(){let v=0;for(const id in S.pos){const c=coinById(id);if(c)v+=S.pos[id].q*c.p}const m=S.coins.filter(c=>c.mine&&!c.rug);for(const c of m)v+=c.dev*c.p*0.5;return v}
function rentPerSec(){let r=0;for(const id in S.owned){const it=ITEM[id];if(it&&it.rent)r+=it.rent*S.owned[id]}return r}

/* ---------- fx ---------- */
const fx=$('#fx'),fctx=fx.getContext('2d');let parts=[],fxRaf=0;
function sizeFx(){const d=devicePixelRatio||1;fx.width=innerWidth*d;fx.height=innerHeight*d;fctx.setTransform(d,0,0,d,0,0)}
sizeFx();addEventListener('resize',sizeFx);
const PAL=['#ffd34d','#ff6bd6','#7af0ff','#8b6cff','#2fe3a4','#ffffff'];
function burst(x,y,n,pal){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rnd(3,11);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,l:1,c:pick(pal||PAL),r:rnd(2,5),rot:rnd(0,6),sq:Math.random()<.5})}if(!fxRaf)fxRaf=requestAnimationFrame(fxLoop)}
function rain(n){for(let i=0;i<n;i++)parts.push({x:rnd(0,innerWidth),y:rnd(-200,-10),vx:rnd(-1,1),vy:rnd(2,6),l:1.6,c:pick(PAL),r:rnd(3,6),rot:rnd(0,6),sq:true});if(!fxRaf)fxRaf=requestAnimationFrame(fxLoop)}
function fxLoop(){fctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.l>0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=.25;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.l-=.012;p.rot+=.2;fctx.globalAlpha=Math.min(1,p.l);fctx.fillStyle=p.c;
    if(p.sq){fctx.save();fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);fctx.restore()}else{fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()}}
  fctx.globalAlpha=1;fxRaf=parts.length?requestAnimationFrame(fxLoop):0}

function mtick(){
  const now=Date.now();
  for(const c of S.coins){
    let dr=c.dr,vo=c.vo;
    if(c.rug){dr=-0.01;vo=0.02}
    else if(c.mine){dr=-0.0035+c.hype*0.00035;c.hype*=0.975;if(c.hype<0.3)c.hype=0;if(Math.random()<0.006+c.hype*0.0004){c.p*=1+rnd(.05,.5);trade(c,'b',rnd(500,5000)*(1+c.hype/20),'whale')}c.hold=Math.max(1,Math.round(c.hold+c.hype*0.05*Math.random()-(c.hype<1?Math.random()*.6:0)))}
    else{
      if(Math.random()<0.012)c.dr=rnd(-0.012,0.01);
      if(Math.random()<0.004){c.p*=1+rnd(.3,1.8);trade(c,'b',rnd(2e3,4e4),'whale')}
      const age=(now-c.born)/1000;
      if(Math.random()<0.0012+(age>300?0.0015:0)){c.rug=true;c.p*=rnd(.01,.04);c.rugT=now;trade(c,'s',c.p*1e9*30,'dev');}
      c.hold=Math.max(1,c.hold+ri(-2,3));
    }
    c.p=Math.max(1e-11,c.p*Math.exp(dr+vo*gauss()));
    c.hist.push(c.p);if(c.hist.length>90)c.hist.shift();
    if(c.p>c.ath)c.ath=c.p;
    if(Math.random()<.5&&!c.rug)trade(c,Math.random()<.5+dr*20?'b':'s',Math.exp(rnd(Math.log(20),Math.log(4000))),null);
  }
  // cleanup: drop old dead coins nobody holds
  S.coins=S.coins.filter(c=>c.mine||S.pos[c.id]||!(c.rug&&now-c.rugT>60000)&&!(c.p*1e9<800&&now-c.born>120000));

}

G.crash=root=>{
  root.innerHTML=`<div class="stage crash"><div class="hist"></div><canvas></canvas><div class="mult-big num">1.00×</div></div><div class="ctrl"></div>`;
  const ctrl=$('.ctrl',root),cv=$('canvas',root),mb=$('.mult-big',root),hb=$('.hist',root);
  const bb=betBox(ctrl);
  const auto=h(`<div class="field"><label>Auto cash out at</label><div class="inp"><input inputmode="decimal" value="2.00" aria-label="Auto cash out"><span style="padding-right:10px">×</span></div></div>`);ctrl.append(auto);
  const btn=h('<button class="btn wide">Place bet</button>');ctrl.append(btn);
  const ctx=cv.getContext('2d');let W,H;
  const fit=()=>{const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};fit();
  let run=false,cashed=false,t0=0,at=1,b=0,raf=0,stars=Array.from({length:40},()=>[Math.random(),Math.random(),Math.random()]);
  const K=0.00012;
  function draw(t,m,dead){
    ctx.clearRect(0,0,W,H);
    for(const s of stars){ctx.fillStyle=`rgba(255,255,255,${.15+s[2]*.4})`;const x=((s[0]-t*0.00002*s[2])%1+1)%1;ctx.fillRect(x*W,s[1]*H,1.5,1.5)}
    const tm=Math.max(t,6000),mm=Math.max(m,2);
    ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,H*i/4);ctx.lineTo(W,H*i/4);ctx.stroke()}
    ctx.beginPath();ctx.moveTo(0,H-6);let X=0,Y=H-6;
    for(let i=0;i<=60;i++){const tt=t*i/60;X=tt/tm*(W-30);Y=H-6-(Math.exp(K*tt)-1)/(mm-1)*(H*0.75);ctx.lineTo(X,Y)}
    const col=dead?'#ff4f6e':'#8b6cff';
    ctx.strokeStyle=col;ctx.lineWidth=4;ctx.lineCap='round';ctx.shadowColor=col;ctx.shadowBlur=18;ctx.stroke();ctx.shadowBlur=0;
    ctx.lineTo(X,H);ctx.lineTo(0,H);const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,dead?'rgba(255,79,110,.35)':'rgba(139,108,255,.35)');gr.addColorStop(1,'transparent');ctx.fillStyle=gr;ctx.fill();

    ctx.fillStyle=col;ctx.globalAlpha=.4;ctx.beginPath();ctx.arc(X,Y,12+Math.sin(t/90)*3,0,7);ctx.fill();ctx.globalAlpha=1;

    mb.textContent=m.toFixed(2)+'×';
    if(!cashed)btn.textContent='Cash out '+fmt(b*m);
    draw(t,m);raf=requestAnimationFrame(loop);
  }
  function cash(m){cashed=true;const amt=b*m;win(amt,b,m);btn.textContent='Cashed '+fmt(amt);btn.disabled=true;mb.style.color='var(--acc2)';toast(`Cashed out at ${m.toFixed(2)}× · ${fmt(amt)}`,'good')}
  function end(){run=false;cancelAnimationFrame(raf);const t=Math.log(at)/K;draw(t,at,true);mb.textContent=at.toFixed(2)+'×';mb.style.color='var(--dn)';histAdd(hb,at,cashed);
    if(!cashed){root.querySelector('.stage').classList.add('shake');vib(60)}setTimeout(()=>root.querySelector('.stage')?.classList.remove('shake'),500);
    btn.disabled=false;btn.textContent='Place bet';bb.lock(false)}
  btn.onclick=()=>{
    if(run){if(!cashed)cash(Math.exp(K*(performance.now()-t0)));return}

};

G.plinko=root=>{
  const ROWS=12;
  const TAB={low:[10,3,1.6,1.4,1.1,1,.5,1,1.1,1.4,1.6,3,10],medium:[33,11,4,2,1.1,.6,.3,.6,1.1,2,4,11,33],high:[170,24,8.1,2,.7,.2,.2,.2,.7,2,8.1,24,170]};
  let risk='medium';
  root.innerHTML=`<div class="stage plinko"><canvas></canvas></div><div class="ctrl"></div>`;
  const ctrl=$('.ctrl',root),cv=$('canvas',root),ctx=cv.getContext('2d');
  const bb=betBox(ctrl);
  const rk=h(`<div class="pills">${['low','medium','high'].map(r=>`<button class="chip ${r===risk?'on':''}" data-r="${r}">${r[0].toUpperCase()+r.slice(1)} risk</button>`).join('')}</div>`);ctrl.append(rk);
  $$('button',rk).forEach(b=>b.onclick=()=>{risk=b.dataset.r;$$('button',rk).forEach(x=>x.classList.toggle('on',x===b))});
  const btn=h('<button class="btn wide">Drop ball</button>');ctrl.append(btn);
  let W,H,gap,gy,top,balls=[],raf=0,flash=new Array(13).fill(0);
  const fit=()=>{const d=devicePixelRatio||1;W=cv.parentElement.clientWidth;H=Math.min(W*1.0,440);cv.style.height=H+'px';cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);gap=(W-24)/(ROWS+1);top=22;gy=(H-70)/ROWS};fit();
  const col=m=>m>=10?'#ff3d6e':m>=3?'#ff7a3d':m>=1.5?'#ffb340':m>=1?'#ffd84d':'#8b6cff';
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let r=0;r<ROWS;r++)for(let j=0;j<r+3;j++){const x=W/2+(j-(r+2)/2)*gap,y=top+r*gy;ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
    const tab=TAB[risk];
    for(let k=0;k<13;k++){const x=W/2+(k-6)*gap,y=top+ROWS*gy+8-(flash[k]>0?-6*Math.sin(flash[k]*Math.PI):0);const w=gap-3;ctx.fillStyle=col(tab[k]);ctx.globalAlpha=.9;
      ctx.beginPath();ctx.roundRect?ctx.roundRect(x-w/2,y,w,24,6):ctx.rect(x-w/2,y,w,24);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle='#120a20';ctx.font=`700 ${gap<26?8:10}px JetBrains Mono, monospace`;ctx.textAlign='center';ctx.fillText(tab[k]>=100?tab[k]|0:tab[k],x,y+16);if(flash[k]>0)flash[k]-=.04}
    for(const b of balls){ctx.fillStyle='#fff';ctx.shadowColor='#ff6bd6';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill();ctx.shadowBlur=0}
  }
  function pt(r,k){return {x:W/2+(k-r/2)*gap,y:top+r*gy-8}}
  function loop(now){
    for(const b of balls){
      const seg=Math.floor((now-b.t0)/140);
      if(seg>=ROWS){if(!b.done){b.done=true;const m=TAB[b.risk][b.k];flash[b.k]=1;const amt=b.bet*m;if(amt>0)win(amt,b.bet,m);vib(12)}continue}
      const f=((now-b.t0)%140)/140,a=pt(seg,b.ks[seg]),c=pt(seg+1,b.ks[seg+1]);
      b.x=a.x+(c.x-a.x)*f;b.y=a.y+(c.y-a.y)*f-Math.sin(f*Math.PI)*gy*0.45;
    }
    balls=balls.filter(b=>!b.done);
    draw();raf=requestAnimationFrame(loop);
  }
  btn.onclick=()=>{const b=bb.get();if(!bet(b))return;let k=0;const ks=[0];for(let r=0;r<ROWS;r++){if(Math.random()<.5)k++;ks.push(k)}const p=pt(0,0);balls.push({t0:performance.now(),ks,k,bet:b,risk,x:p.x,y:p.y});vib(6)};
  raf=requestAnimationFrame(loop);
  return()=>cancelAnimationFrame(raf);
};

const cardEl=(c,hidden)=>hidden?'<div class="pc back"></div>':`<div class="pc ${c.s===1||c.s===2?'r':''}"><span>${RK[c.r]}</span><i>${SUITS[c.s]}</i></div>`;
/* ---- Blackjack ---- */
G.blackjack=root=>{
  root.innerHTML=`<div class="stage felt"><div class="lbl">Dealer <b id="dv">0</b></div><div class="hand" id="dh"></div><div class="lbl" style="font-family:var(--f-disp);font-size:13px;opacity:.6">BLACKJACK PAYS 3 TO 2 · DEALER STANDS ON 17</div><div class="hand" id="ph"></div><div class="lbl">You <b id="pv">0</b></div></div><div class="ctrl"></div>`;
  const ctrl=$('.ctrl',root),bb=betBox(ctrl);
  const acts=h(`<div class="grid2" hidden><button class="btn ghost" id="hit">Hit</button><button class="btn ghost" id="std">Stand</button><button class="btn ghost" id="dbl" style="grid-column:1/-1">Double down</button></div>`);ctrl.append(acts);
  const btn=h('<button class="btn wide">Deal</button>');ctrl.append(btn);
  let P=[],D=[],b=0,on=false,hide=true;
  const val=hd=>{let v=0,a=0;for(const c of hd){const x=c.r===0?11:Math.min(10,c.r+1);v+=x;if(c.r===0)a++}while(v>21&&a){v-=10;a--}return v};
  function render(){$('#ph').innerHTML=P.map(c=>cardEl(c)).join('');$('#dh').innerHTML=D.map((c,i)=>cardEl(c,hide&&i===1)).join('');$('#pv').textContent=val(P);$('#dv').textContent=hide?val([D[0]]):val(D)}
  function settle(){on=false;hide=true;
    hide=false;while(val(D)<17&&val(P)<=21)D.push(draw1());render();
    const p=val(P),d=val(D),pbj=p===21&&P.length===2,dbj=d===21&&D.length===2;let m=0,msg;
    if(p>21){msg='Bust'}else if(pbj&&!dbj){m=2.5;msg='Blackjack!'}else if(dbj&&!pbj){msg='Dealer blackjack'}else if(d>21||p>d){m=2;msg='You win'}else if(p===d){m=1;msg='Push'}else msg='Dealer wins';
    if(m>0)win(b*m,b,m);if(m===0)vib(50);toast(msg+(m>0?' · '+fmt(b*m):''),m>1?'good':m===0?'bad':'');
    acts.hidden=true;btn.hidden=false;bb.lock(false)}
  btn.onclick=()=>{b=bb.get();if(!bet(b))return;P=[draw1(),draw1()];D=[draw1(),draw1()];hide=true;on=true;$('#ph').innerHTML='';$('#dh').innerHTML='';render();bb.lock(true);
    if(val(P)===21||val(D)===21){setTimeout(settle,500);return}acts.hidden=false;btn.hidden=true;$('#dbl',acts).disabled=S.cash<b};
  $('#hit',acts).onclick=()=>{if(!on)return;P.push(draw1());render();vib(8);$('#dbl',acts).disabled=true;if(val(P)>21)setTimeout(settle,400);else if(val(P)===21)setTimeout(settle,400)};
  $('#std',acts).onclick=()=>{if(on)settle()};
  $('#dbl',acts).onclick=()=>{if(!on||!bet(b))return;b*=2;P.push(draw1());render();setTimeout(settle,450)};
};
/* ---- Roulette ---- */
G.roulette=root=>{
  const ORD=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const OUT=[['red','Red',2],['black','Black',2],['odd','Odd',2],['even','Even',2],['low','1–18',2],['high','19–36',2],['d1','1st 12',3],['d2','2nd 12',3],['d3','3rd 12',3]];
  root.innerHTML=`<div class="stage"><div class="wheelwrap"><div class="ptr"></div><canvas width="500" height="500"></canvas><div class="hub num" id="rr">–</div></div><div class="hist" style="justify-content:center"></div></div>
  <div class="card" style="padding:10px"><div class="rboard"><button class="rc grn" data-k="n0">0</button>${Array.from({length:36},(_,i)=>`<button class="rc ${RED.has(i+1)?'red':'blk'}" data-k="n${i+1}">${i+1}</button>`).join('')}</div>
  <div class="rout">${OUT.map(o=>`<button class="rc out" data-k="${o[0]}">${o[1]}</button>`).join('')}</div></div><div class="ctrl"></div>`;
  const cv=$('canvas',root),ctx=cv.getContext('2d'),seg=Math.PI*2/37;
  for(let i=0;i<37;i++){const n=ORD[i],a=-Math.PI/2+i*seg;ctx.beginPath();ctx.moveTo(250,250);ctx.arc(250,250,248,a,a+seg);ctx.fillStyle=n===0?'#0f8a5f':RED.has(n)?'#c4223d':'#17152a';ctx.fill();ctx.strokeStyle='#c9a45f';ctx.lineWidth=1.5;ctx.stroke();
    ctx.save();ctx.translate(250,250);ctx.rotate(a+seg/2+Math.PI/2);ctx.fillStyle='#fff';ctx.font='700 20px JetBrains Mono, monospace';ctx.textAlign='center';ctx.fillText(n,0,-212);ctx.restore()}
  ctx.beginPath();ctx.arc(250,250,180,0,7);ctx.fillStyle='#0e0c22';ctx.fill();ctx.strokeStyle='#c9a45f';ctx.lineWidth=3;ctx.stroke();
  const ctrl=$('.ctrl',root),bb=betBox(ctrl);
  const tot=h('<div class="row" style="justify-content:space-between"><span class="eyebrow">Chips on table</span><b class="num" id="rt">$0.00</b></div>');ctrl.append(tot);
  const row=h('<div class="grid2"><button class="btn ghost" id="rcl">Clear</button><button class="btn" id="rsp">Spin</button></div>');ctrl.append(row);
  let bets={},rot=0,busy=false;
  const sum=()=>Object.values(bets).reduce((a,b)=>a+b,0);
  const paint=()=>{$$('.rc',root).forEach(c=>{const v=bets[c.dataset.k];c.querySelector('em')?.remove();if(v)c.append(h(`<em>${v>=1000?(v/1000).toFixed(1)+'k':+v.toFixed(2)}</em>`))});$('#rt').textContent=fmt(sum(),true)};
  $$('.rc',root).forEach(c=>c.onclick=()=>{if(busy)return;const v=bb.get();if(!(v>0))return;if(sum()+v>S.cash){toast('Not enough cash','bad');return}bets[c.dataset.k]=(bets[c.dataset.k]||0)+v;vib(6);paint()});
  $('#rcl').onclick=()=>{if(busy)return;bets={};paint()};
  $('#rsp').onclick=()=>{if(busy)return;const t=sum();if(!t){toast('Tap the board to place chips','bad');return}if(!bet(t))return;busy=true;$$('.rc.hit',root).forEach(x=>x.classList.remove('hit'));
    const idx=ri(0,36),n=ORD[idx],center=(idx+.5)*360/37;const cur=((rot%360)+360)%360;let delta=(360-center-cur+720)%360;rot+=360*6+delta;cv.style.transform=`rotate(${rot}deg)`;$('#rr').textContent='…';
    setTimeout(()=>{$('#rr').textContent=n;let pay=0;
      for(const [k,v] of Object.entries(bets)){let ok=false,m=2;
        if(k[0]==='n'){ok=+k.slice(1)===n;m=36}else if(n!==0){ok=k==='red'?RED.has(n):k==='black'?!RED.has(n):k==='odd'?n%2===1:k==='even'?n%2===0:k==='low'?n<=18:k==='high'?n>=19:k==='d1'?n<=12:k==='d2'?n>12&&n<=24:n>24;if(k[0]==='d')m=3}
        if(ok)pay+=v*m}
      $(`.rc[data-k="n${n}"]`,root).classList.add('hit');histAdd($('.hist',root),n,pay>0);$('.hist span',root).textContent=n;
      if(pay>0){win(pay,t,pay/t);toast(`${n} · paid ${fmt(pay)}`,'good')}else{toast(`${n} · house wins`,'bad');vib(50)}
      busy=false},4300)};
};

G.wheel=root=>{

/* ---- Keno ---- */
G.keno=root=>{
  const comb=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};
  const table=n=>{const P=[],w=[],min=Math.max(1,Math.ceil(n/2));for(let hh=0;hh<=n;hh++){P[hh]=comb(n,hh)*comb(40-n,10-hh)/comb(40,10);w[hh]=hh>=min?Math.pow(3.2,hh-min+1):0}const ev=P.reduce((a,p,i)=>a+p*w[i],0);return w.map(x=>x?Math.round(x*0.97/ev*100)/100:0)};
  root.innerHTML=`<div class="stage"><div class="kgrid">${Array.from({length:40},(_,i)=>`<button class="kt" data-n="${i+1}">${i+1}</button>`).join('')}</div><div class="ktab"></div></div><div class="ctrl"></div>`;
  const ctrl=$('.ctrl',root),bb=betBox(ctrl);
  const row=h('<div class="grid2"><button class="btn ghost" id="kap">Auto pick</button><button class="btn ghost" id="kcl">Clear</button></div>');ctrl.append(row);
  const btn=h('<button class="btn wide">Play · pick 1–10</button>');ctrl.append(btn);
  let sel=new Set(),busy=false;const kts=$$('.kt',root);
  const paintTab=hits=>{const n=sel.size;$('.ktab',root).innerHTML=n?table(n).map((m,i)=>`<span class="${hits===i?'on':''}">${i} hit<br><b>${m}×</b></span>`).join(''):'<span>Pick numbers to see payouts</span>'};
  const paint=()=>{kts.forEach(t=>{t.className='kt'+(sel.has(+t.dataset.n)?' pick':'')});paintTab(-1)};paint();
  kts.forEach(t=>t.onclick=()=>{if(busy)return;const n=+t.dataset.n;if(sel.has(n))sel.delete(n);else if(sel.size<10)sel.add(n);vib(5);paint()});
  $('#kcl').onclick=()=>{if(!busy){sel.clear();paint()}};
  $('#kap').onclick=()=>{if(busy)return;sel.clear();while(sel.size<10)sel.add(ri(1,40));paint()};
  btn.onclick=()=>{if(busy)return;if(!sel.size){toast('Pick at least one number','bad');return}const b=bb.get();if(!bet(b))return;busy=true;paint();
    const dr=new Set();while(dr.size<10)dr.add(ri(1,40));const arr=[...dr];let hits=0,i=0;
    const iv=setInterval(()=>{const n=arr[i],t=kts[n-1];if(sel.has(n)){t.className='kt hitk';hits++;vib(8)}else t.className='kt drawn';
      if(++i>=10){clearInterval(iv);const m=table(sel.size)[hits];paintTab(hits);if(m>0)win(b*m,b,m);else vib(40);toast(`${hits} hits · ${m}×`,m>=1?'good':'bad');busy=false}},110)};
};

/* ================= TRADE ================= */
let tab='new',setTab=()=>{};
function spark(hist,w=54,hh=26){const a=hist.slice(-40);if(a.length<2)return `<svg viewBox="0 0 ${w} ${hh}"></svg>`;const mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(hh-2-(v-mn)/r*(hh-4)).toFixed(1)}`).join(' ');const up=a[a.length-1]>=a[0];
  return `<svg viewBox="0 0 ${w} ${hh}"><polyline points="${pts}" fill="none" stroke="${up?'var(--up)':'var(--dn)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`}
const chg=c=>{const a=c.hist,o=a[Math.max(0,a.length-60)];return c.p/o-1};
const age=c=>{const s=(Date.now()-c.born)/1000|0;return s<60?s+'s':s<3600?(s/60|0)+'m':(s/3600|0)+'h'};
const avBg=c=>`linear-gradient(135deg,hsl(${c.hue} 85% 58%),hsl(${(c.hue+60)%360} 80% 40%))`;
const BOLT='<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
function buy(c,usd){if(c.rug){toast('Liquidity pulled. Cannot buy.','bad');return}if(!spend(usd))return;const q=usd/c.p;const p=S.pos[c.id]||(S.pos[c.id]={q:0,c:0});p.q+=q;p.c+=usd;c.p*=1+usd/liq(c);trade(c,'b',usd,'you');vib(12);toast(`Bought ${fmt(usd)} of $${esc(c.tk)}`,'good');save()}
function sell(c,frac){const p=S.pos[c.id];if(!p||p.q<=0){toast('No position','bad');return}const q=p.q*frac;let usd=q*c.p;usd*=Math.max(0.5,1-usd/liq(c)/2);c.p*=Math.max(0.3,1-usd/liq(c));
  p.c*=(1-frac);p.q-=q;if(frac>=1||p.q*c.p<0.01)delete S.pos[c.id];earn(usd);trade(c,'s',usd,'you');vib(12);toast(`Sold for ${fmt(usd)}`,usd>0?'good':'');save()}
function tradeView(el){
  el.innerHTML=`<div class="th"><h1>pulse<span class="mute">/</span>terminal</h1><label class="qb"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span class="mute">$</span><input inputmode="decimal" id="qb" value="${S.qb}" aria-label="Quick buy amount"></label></div>
  <div class="ttabs"><button data-t="new">New pairs</button><button data-t="hot">Trending</button><button data-t="pos">Positions</button><button data-t="launch">Launch</button></div><div id="tbody"></div>`;
  $('#qb',el).onchange=e=>{S.qb=Math.max(1,parseFloat(e.target.value)||100);e.target.value=S.qb;save()};
  setTab=t=>{tab=t;$$('.ttabs button',el).forEach(b=>b.classList.toggle('on',b.dataset.t===t));render(true)};
  $$('.ttabs button',el).forEach(b=>b.onclick=()=>setTab(b.dataset.t));
  const body=$('#tbody',el);
  function rowsFor(){let a=S.coins.slice();
    if(tab==='new')a.sort((x,y)=>y.born-x.born);else if(tab==='hot')a=a.filter(c=>!c.rug).sort((x,y)=>y.p*1e9-x.p*1e9);else if(tab==='pos')a=a.filter(c=>S.pos[c.id]||c.mine).sort((x,y)=>(y.mine-x.mine));return a}
  function row(c){const ch=chg(c),p=S.pos[c.id];return `<button class="trow" data-id="${c.id}"><div class="av ${Date.now()-c.born<20000?'new':''}" style="background:${avBg(c)}">${esc(c.tk.slice(0,2))}</div>
    <div class="tmid"><div class="n">${esc(c.tk)} <small>${esc(c.name)}</small>${c.rug?'<span class="tag rug">RUGGED</span>':''}${c.mine?'<span class="tag dev">DEV</span>':''}${!c.rug&&ch>.5?'<span class="tag hot">HOT</span>':''}</div>
    <div class="m"><span>MC <b>${fmt(c.p*1e9)}</b></span><span class="${ch>=0?'up':'dn'}">${pct(ch)}</span><span>${age(c)}</span>${p?`<span>bag <b class="${p.q*c.p>=p.c?'up':'dn'}">${fmt(p.q*c.p)}</b></span>`:`<span>${c.hold} holders</span>`}</div></div>
    <div class="tright">${spark(c.hist)}<span class="ape" data-ape="${c.id}">${BOLT}${S.qb>=1000?(S.qb/1000)+'k':S.qb}</span></div></button>`}
  function render(full){
    if(tab==='launch'){if(full)launchForm(body);return}
    const a=rowsFor();
    if(!a.length){body.innerHTML=`<div class="card mute" style="margin-top:12px">${tab==='pos'?'No bags yet. Tap the lightning button on any pair to ape in.':'Waiting for pairs…'}</div>`;return}

    $$('.trow',body).forEach(r=>r.onclick=e=>{const ape=e.target.closest('[data-ape]');const c=coinById(r.dataset.id);if(!c)return;if(ape){e.stopPropagation();buy(c,S.qb);r.classList.add('flashg');render()}else coinSheet(c)});
  }
  setTab(tab);
  const t=()=>{if(tab!=='launch')render()};tickSubs.add(t);
  return()=>{tickSubs.delete(t)};
}
function launchForm(body){

  nm.oninput=upd;tk.oninput=upd;$$('.hues button').forEach(b=>b.onclick=()=>{hue=+b.dataset.h;$$('.hues button').forEach(x=>x.classList.toggle('on',x===b));upd()});upd();
  $('#ldo').onclick=()=>{const n=nm.value.trim(),t=tk.value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(!n||!t){toast('Give it a name and a ticker','bad');return}
    if(!spend(1000))return;const c=mkCoin({name:n,tk:t,hue,mine:true,mc:8000});c.hold=1;c.dr=0;S.coins.unshift(c);S.stats.launched++;save();burst(innerWidth/2,innerHeight/2,70);toast(`$${esc(t)} is live on-chain (not really)`,'good');setTab('pos');coinSheet(c)};

const ADS=[['X raid bot army',300,10],['Telegram call groups',1500,22],['Pay a KOL to shill',10000,45],['Streamer promo',50000,85],['Times Square billboard',250000,170],['Celebrity tweet',1500000,340]];
function coinSheet(c){
  const el=h(`<div></div>`);let close;
  function draw(){
    const p=S.pos[c.id],val=p?p.q*c.p:0,pnl=p?val-p.c:0,ch=chg(c);
    el.innerHTML=`<div class="cd-h"><div class="av" style="background:${avBg(c)}">${esc(c.tk.slice(0,2))}</div><div style="min-width:0;flex:1"><b style="font-size:17px">$${esc(c.tk)}</b> <span class="mute">${esc(c.name)}</span>${c.rug?' <span class="tag rug">RUGGED</span>':''}${c.mine?' <span class="tag dev">YOUR COIN</span>':''}<div class="cd-p num">${fmtP(c.p)} <span class="${ch>=0?'up':'dn'}" style="font-size:14px">${pct(ch)}</span></div></div></div>
    <canvas class="chart"></canvas>
    <div class="kv"><div><span>Market cap</span><b>${fmt(c.p*1e9)}</b></div><div><span>ATH</span><b>${fmt(c.ath*1e9)}</b></div><div><span>Holders</span><b>${c.hold}</b></div><div><span>Volume</span><b>${fmt(c.volu)}</b></div><div><span>Your bag</span><b>${fmt(val)}</b></div><div><span>PnL</span><b class="${pnl>=0?'up':'dn'}">${p?(pnl>=0?'+':'')+fmt(pnl):'–'}</b></div></div>
    <div class="eyebrow" style="margin:14px 0 6px">Buy</div><div class="bs">${[50,250,1000,5000].map(x=>`<button class="b" data-b="${x}">$${x>=1000?x/1000+'k':x}</button>`).join('')}</div>
    <div class="bs" style="margin-top:6px"><button class="b" data-b="q">$${S.qb}</button><button class="b" data-b="25k">$25k</button><button class="b" data-b="100k">$100k</button><button class="b" data-b="max">Max</button></div>
    <div class="eyebrow" style="margin:14px 0 6px">Sell</div><div class="bs">${[.1,.25,.5,1].map(x=>`<button class="s" data-s="${x}">${x*100}%</button>`).join('')}</div>
    ${c.mine&&!c.rug?`<div class="eyebrow" style="margin:18px 0 6px;display:flex;justify-content:space-between"><span>Hype</span><span class="num">${c.hype.toFixed(0)}</span></div><div class="hype"><b style="width:${Math.min(100,c.hype/3.4)}%"></b></div>
      <div class="eyebrow" style="margin:14px 0 6px">Advertise</div><div class="ads">${ADS.map((a,i)=>`<button data-ad="${i}"><b>${a[0]}</b><span>${fmt(a[1])} · +${a[2]} hype</span></button>`).join('')}</div>
      <div class="card" style="margin-top:12px;display:flex;justify-content:space-between;align-items:center"><div><div class="eyebrow">Dev bag · 30%</div><b class="num" style="font-size:18px">${fmt(c.dev*c.p)}</b></div><span class="mute" style="font-size:11px;text-align:right">rug sells into<br>thin liquidity · ~55%</span></div>
      <button class="rugbtn" style="margin-top:10px"><i></i><span>HOLD TO RUG PULL</span></button>`:''}
    <div class="eyebrow" style="margin:16px 0 6px">Live trades</div><div class="feed" id="feed"></div>`;
    chart($('canvas',el),c);
    $$('[data-b]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.b;const v=k==='q'?S.qb:k==='25k'?25000:k==='100k'?100000:k==='max'?Math.floor(S.cash*100)/100:+k;if(v>0)buy(c,v);draw()});
    $$('[data-s]',el).forEach(b=>b.onclick=()=>{sell(c,+b.dataset.s);draw()});
    $$('[data-ad]',el).forEach(b=>b.onclick=()=>{const [n,cost,hy]=ADS[+b.dataset.ad];if(!spend(cost))return;const got=hy*rnd(.4,1.6);c.hype+=got;c.hold+=Math.round(got*rnd(1,4));
      const r=b.getBoundingClientRect();burst(r.left+r.width/2,r.top,25,['#ff9f2e','#ff4fd0','#7af0ff']);
      if(Math.random()<.12&&cost>=10000){c.p*=.8;toast(`${n} took the money and dumped on you`,'bad')}else toast(`${n} · +${got.toFixed(0)} hype`,'good');draw()});
    const rb=$('.rugbtn',el);if(rb){let tm;const start=e=>{e.preventDefault();rb.classList.add('hold');vib(20);tm=setTimeout(()=>{rug(c);draw()},1300)},end=()=>{rb.classList.remove('hold');clearTimeout(tm)};
      rb.addEventListener('pointerdown',start);rb.addEventListener('pointerup',end);rb.addEventListener('pointerleave',end);rb.addEventListener('pointercancel',end);rb.oncontextmenu=e=>e.preventDefault()}
    const fd=$('#feed',el);recent.filter(x=>x.id===c.id).slice(0,8).forEach(x=>fd.append(feedRow(x)));
  }
  function light(){
    if(!document.body.contains(el))return;
    const p=S.pos[c.id],val=p?p.q*c.p:0,pnl=p?val-p.c:0,ch=chg(c);
    const cp=$('.cd-p',el);if(cp)cp.innerHTML=`${fmtP(c.p)} <span class="${ch>=0?'up':'dn'}" style="font-size:14px">${pct(ch)}</span>`;
    const kv=$$('.kv b',el);if(kv.length){kv[0].textContent=fmt(c.p*1e9);kv[1].textContent=fmt(c.ath*1e9);kv[2].textContent=c.hold;kv[3].textContent=fmt(c.volu);kv[4].textContent=fmt(val);kv[5].textContent=p?(pnl>=0?'+':'')+fmt(pnl):'–';kv[5].className=pnl>=0?'up':'dn'}
    const hb=$('.hype b',el);if(hb)hb.style.width=Math.min(100,c.hype/3.4)+'%';
    const hv=$('.eyebrow .num',el);if(hv)hv.textContent=c.hype.toFixed(0);
    const db=$('.card b.num',el);if(db&&c.mine)db.textContent=fmt(c.dev*c.p);
    chart($('canvas',el),c);
  }
  const onFeed=(cc,side,usd,who)=>{if(cc!==c)return;const fd=$('#feed',el);if(!fd)return;fd.prepend(feedRow({side,usd,who}));while(fd.children.length>8)fd.lastChild.remove()};
  draw();tickSubs.add(light);feedSubs.add(onFeed);
  close=sheet(el,()=>{tickSubs.delete(light);feedSubs.delete(onFeed)});
}
const recent=[];feedSubs.add((c,side,usd,who)=>{recent.unshift({id:c.id,side,usd,who});if(recent.length>200)recent.pop()});
function feedRow(x){const w=x.who==='you'?'you':x.who==='whale'?'🐋 whale':x.who==='dev'?'dev wallet':Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,5);
  return h(`<div><span class="${x.side==='b'?'up':'dn'}">${x.side==='b'?'BUY ':'SELL'}</span><span class="mute">${w}</span><b>${fmt(x.usd)}</b></div>`)}
function rug(c){if(c.rug||!c.mine)return;const usd=c.dev*c.p*0.55;c.dev=0;c.rug=true;c.rugT=Date.now();c.p*=0.012;c.hype=0;S.stats.rugs++;earn(usd);trade(c,'s',usd,'dev');
  vib([80,40,120]);rain(80);bigWin(Math.max(1,usd/1000),usd);toast(`Rugged $${esc(c.tk)} · walked with ${fmt(usd)}`,'good');save()}
function chart(cv,c){if(!cv)return;const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;cv.width=W*d;cv.height=H*d;const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const a=c.hist,G_=3,cs=[];for(let i=0;i<a.length;i+=G_){const s=a.slice(Math.max(0,i-1),i+G_);if(!s.length)continue;cs.push({o:s[0],c:s[s.length-1],h:Math.max(...s),l:Math.min(...s)})}
  if(!cs.length)return;const mn=Math.min(...cs.map(k=>k.l)),mx=Math.max(...cs.map(k=>k.h)),r=(mx-mn)||mx*.01,pad=14,Y=v=>pad+(1-(v-mn)/r)*(H-pad*2);
  x.strokeStyle='rgba(255,255,255,.05)';for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,H*i/4);x.lineTo(W,H*i/4);x.stroke()}
  const cw=Math.max(2,(W-50)/30*0.62),step=(W-50)/30;
  cs.slice(-30).forEach((k,i)=>{const cx=8+i*step+step/2,up=k.c>=k.o,col=up?'#2fe3a4':'#ff4f6e';x.strokeStyle=col;x.fillStyle=col;x.beginPath();x.moveTo(cx,Y(k.h));x.lineTo(cx,Y(k.l));x.stroke();const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));x.fillRect(cx-cw/2,y1,cw,Math.max(1.5,y2-y1))});
  const ly=Y(c.p);x.setLineDash([3,3]);x.strokeStyle='rgba(255,255,255,.35)';x.beginPath();x.moveTo(0,ly);x.lineTo(W-46,ly);x.stroke();x.setLineDash([]);
  x.fillStyle=c.hist.at(-1)>=c.hist.at(-2)?'#2fe3a4':'#ff4f6e';x.fillRect(W-46,ly-9,46,18);x.fillStyle='#04120c';x.font='700 9px JetBrains Mono, monospace';x.textAlign='center';x.fillText(fmt(c.p*1e9).replace('$',''),W-23,ly+3)}

  };
  $$('.lux-tabs button',el).forEach(b=>b.onclick=()=>{shopCat=b.dataset.c;vib(6);render()});render();
}
