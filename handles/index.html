<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handles">
<meta name="theme-color" content="#3390ec">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Handle Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Layout: sticky messenger-style header, options rail on desktop / collapsible card on phone,
   tile grid of handles, bottom action bar on phone. Telegram-blue accent, tier colours carry value. */
:root{
  --bg:#eef1f5;--surf:#ffffff;--surf2:#f3f6f9;--line:#e1e6ec;--txt:#0f1419;--mute:#6b7683;
  --acc:#3390ec;--accs:#e7f1fd;--accT:#ffffff;
  --lg:#e8a317;--ep:#8b5cf6;--ra:#2a9ee8;--un:#2fb463;--co:#8b97a4;
  --sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px -8px rgba(16,24,40,.12);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:16px;--hdr:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--surf:#17212b;--surf2:#1f2c3a;--line:#253445;--txt:#f1f4f7;--mute:#8195a8;--acc:#2ea6ff;--accs:rgba(46,166,255,.14);--accT:#ffffff;--lg:#f5b52e;--ep:#a07bff;--ra:#3fb1ff;--un:#3ccf74;--co:#8a9bad;--sh:0 1px 0 rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1621;--surf:#17212b;--surf2:#1f2c3a;--line:#253445;--txt:#f1f4f7;--mute:#8195a8;--acc:#2ea6ff;--accs:rgba(46,166,255,.14);--accT:#ffffff;--lg:#f5b52e;--ep:#a07bff;--ra:#3fb1ff;--un:#3ccf74;--co:#8a9bad;--sh:0 1px 0 rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font-family:var(--f);font-size:14px;-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surf)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--txt)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tile:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;height:var(--hdr);display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-family:var(--m);font-weight:800;font-size:19px;background:linear-gradient(145deg,#37b6ff,#2b7ff0);box-shadow:0 4px 12px -4px rgba(43,127,240,.6)}
.tabs{display:none;margin-left:12px;background:var(--surf2);border-radius:12px;padding:3px}
.tabs button{height:34px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:6px}
.tabs button.on{background:var(--surf);color:var(--txt);box-shadow:var(--sh)}
.cnt{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:inline-grid;place-items:center}
.platw{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.sel{height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:0 30px 0 12px;font-weight:600;font-size:15px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:160px}

/* layout */
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.app[data-view="vault"] .side{display:none}
@media (min-width:920px){
  body{padding-bottom:0}
  .tabs{display:flex}
  .wrap{grid-template-columns:320px minmax(0,1fr);align-items:start}
  .app[data-view="vault"] .wrap{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:calc(var(--hdr) + 14px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--hdr) - 28px);overflow:auto;scrollbar-width:thin;padding-bottom:8px}
  .bbar{display:none!important}
  .opts>summary{pointer-events:none}
  .opts>summary .chev{display:none}
}

/* mode chips */
.modes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.modes::-webkit-scrollbar{display:none}
@media (min-width:920px){.modes{display:grid;grid-template-columns:1fr 1fr;overflow:visible}}
.mode{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:13px;background:var(--surf);border:1px solid var(--line);font-weight:600;color:var(--txt);transition:background .15s,border-color .15s,color .15s}
.mode i{font-style:normal;font-family:var(--m);font-size:12px;font-weight:800;color:var(--mute);background:var(--surf2);border-radius:7px;padding:2px 6px}
.mode.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mode.on i{background:rgba(255,255,255,.2);color:#fff}

/* options card */
.opts{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.opts>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700}
.opts>summary::-webkit-details-marker{display:none}
.opts>summary small{font-weight:500;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:right}
.chev{width:9px;height:9px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-3px);transition:transform .2s;flex:0 0 auto}
.opts[open] .chev{transform:rotate(225deg) translateY(-1px)}
.ob{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.og{display:flex;flex-direction:column;gap:7px}
.ol{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 13px;border-radius:10px;background:var(--surf2);font-weight:600;font-size:14px;color:var(--txt);transition:background .12s,color .12s}
.seg button.on{background:var(--accs);color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.mono{font-family:var(--m)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.step{display:flex;align-items:center;justify-content:space-between;height:40px;border-radius:11px;background:var(--surf2);padding:0 4px}
.step b{font-family:var(--m);font-size:15px}
.step button{width:32px;height:32px;border-radius:9px;font-size:18px;font-weight:700;color:var(--acc)}
.step button:active{background:var(--accs)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;font-weight:600}
.tg small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:0 0 auto;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
.tin{height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surf2);padding:0 12px;width:100%;outline:0;font-family:var(--m);font-weight:700}
.tokens{display:flex;flex-wrap:wrap;gap:5px}
.tokens button{height:30px;min-width:30px;padding:0 8px;border-radius:8px;background:var(--surf2);font-family:var(--m);font-weight:800;font-size:13px}
.tokens button:active{background:var(--accs)}
.hint{font-size:12.5px;line-height:1.45;color:var(--mute)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accs);color:var(--txt);font-size:13px;line-height:1.45}
.tip b{color:var(--acc)}

/* results toolbar */
.bar{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:10;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;background:var(--bg)}
.bar .info{font-weight:700;margin-right:auto;white-space:nowrap}
.bar .info small{font-weight:500;color:var(--mute);margin-left:6px}
.btn{height:38px;padding:0 14px;border-radius:11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;background:var(--surf);border:1px solid var(--line);color:var(--txt);white-space:nowrap;transition:transform .1s,background .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.big{height:46px;padding:0 22px;font-size:15px;border-radius:13px}
.btn.on{color:var(--acc);border-color:var(--acc);background:var(--accs)}
.btn.danger{color:#e5484d}
.hidem{display:none}
@media (min-width:920px){.hidem{display:inline-flex}}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:8px}}
.tile{--tc:var(--co);position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:98px;padding:14px 12px 10px 14px;border-radius:var(--r);background:color-mix(in srgb,var(--tc) 7%,var(--surf));border:1px solid color-mix(in srgb,var(--tc) 22%,var(--line));box-shadow:var(--sh);cursor:pointer;overflow:hidden;user-select:none;-webkit-user-select:none;animation:tin .34s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms);content-visibility:auto;contain-intrinsic-size:auto 100px;transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.tile::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3.5px;border-radius:0 4px 4px 0;background:var(--tc)}
.t-lg{--tc:var(--lg)}.t-ep{--tc:var(--ep)}.t-ra{--tc:var(--ra)}.t-un{--tc:var(--un)}.t-co{--tc:var(--co)}
.tn{font-family:var(--m);font-weight:800;letter-spacing:-.01em;line-height:1.1;word-break:break-all;padding-right:28px;color:var(--txt)}
.t-ra .tn{color:var(--ra)}.t-un .tn{color:var(--un)}
.t-ep .tn{background:linear-gradient(90deg,var(--ep),#d27cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.t-lg .tn{background:linear-gradient(90deg,var(--lg),#ffe08a 45%,var(--lg) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 3.2s linear infinite}
.tile.t-lg{box-shadow:var(--sh),0 0 0 1px color-mix(in srgb,var(--lg) 35%,transparent),0 8px 24px -12px color-mix(in srgb,var(--lg) 70%,transparent)}
@keyframes shim{to{background-position:-220% 0}}
.tm{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tier{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--tc);display:inline-flex;align-items:center;gap:4px}
.tier::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc)}
.tag{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--txt) 7%,transparent);color:var(--mute)}
.fc{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--mute)}
.ib{position:absolute;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mute);transition:color .15s,background .15s}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:color-mix(in srgb,var(--txt) 8%,transparent)}
.ib.sv{top:6px;right:6px}
.ib.sv.on{color:var(--lg)}.ib.sv.on svg{fill:var(--lg);stroke:var(--lg)}
.tile.cp::after{content:"Copied";position:absolute;inset:0;display:grid;place-items:center;background:var(--acc);color:#fff;font-weight:800;font-size:15px;letter-spacing:.02em;animation:cp .75s ease forwards}
@keyframes cp{0%{opacity:0}12%{opacity:.96}70%{opacity:.96}100%{opacity:0}}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.sent{height:1px}
.empty{padding:40px 16px;text-align:center;color:var(--mute);line-height:1.5}
.empty b{display:block;color:var(--txt);font-size:16px;margin-bottom:4px}
.more{display:flex;justify-content:center;padding:12px 0 4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.legend i{width:8px;height:8px;border-radius:50%;background:var(--tc)}

/* vault */
.vtool .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.vtool .seg::-webkit-scrollbar{display:none}
.vtool .seg button{flex:0 0 auto}
.vtool{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:12px}
.srch{display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--surf2);padding:0 12px}
.srch svg{width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;flex:0 0 auto}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%}
.vstats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vstat{flex:1 0 auto;min-width:76px;padding:10px 12px;border-radius:12px;background:var(--surf2);display:flex;flex-direction:column;gap:2px}
.vstat b{font-size:18px;font-variant-numeric:tabular-nums}
.vstat span{font-size:11px;color:var(--mute);font-weight:600}
.vlist{display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.vrow{--tc:var(--co);display:grid;grid-template-columns:4px minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:10px 8px 10px 0;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 58px}
.vrow:last-child{border-bottom:0}
.vrow>i{align-self:stretch;background:var(--tc);border-radius:0 3px 3px 0}
.vn{min-width:0;cursor:pointer;padding:2px 0}
.vn b{display:block;font-family:var(--m);font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow.t-ra .vn b{color:var(--ra)}.vrow.t-un .vn b{color:var(--un)}.vrow.t-ep .vn b{color:var(--ep)}.vrow.t-lg .vn b{color:var(--lg)}
.vn small{display:block;font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{height:28px;padding:0 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.st-idea{background:var(--surf2);color:var(--mute)}.st-avail{background:color-mix(in srgb,var(--un) 16%,transparent);color:var(--un)}.st-claimed{background:var(--accs);color:var(--acc)}.st-taken{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}
.vrow .ib{position:static;width:34px;height:34px}
.vrow.cp{background:var(--accs)}

/* bottom bar (phone) */
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surf) 94%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.bn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);height:52px;justify-content:center;border-radius:12px}
.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bn.on{color:var(--acc)}
.bn span{display:flex;align-items:center;gap:4px}
.fab{height:52px;padding:0 26px;border-radius:26px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--acc) 80%,transparent);transition:transform .1s}
.fab:active{transform:scale(.95)}
.fab svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}

/* sheet + toast */
.sbg{position:fixed;inset:0;z-index:40;background:rgba(10,16,24,.45);animation:fade .2s}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--surf);border-radius:22px 22px 0 0;padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:sup .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@media (min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(460px,92vw);border-radius:22px;transform:translate(-50%,-50%);animation:pop .22s ease;padding-bottom:22px}.sheet .grab{display:none}}
@keyframes fade{from{opacity:0}}
@keyframes sup{from{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.97)}}
.dh{font-family:var(--m);font-weight:800;font-size:clamp(26px,9vw,40px);letter-spacing:-.02em;word-break:break-all;line-height:1.1}
.dsec{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.meter{height:8px;border-radius:4px;background:var(--surf2);overflow:hidden}
.meter b{display:block;height:100%;border-radius:4px;background:var(--tc)}
.why{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.why div{display:flex;justify-content:space-between;gap:10px}
.why b{color:var(--txt);font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pc{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-radius:10px;background:var(--surf2);font-size:13px;font-weight:600;color:var(--txt);text-decoration:none}
.pc em{font-style:normal;font-size:12px}
.pc .ok{color:var(--un)}.pc .no{color:#e5484d}
a.pc:active{background:var(--accs)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.acts .btn{justify-content:center;height:46px}
.ta{width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:10px 12px;font-family:var(--m);font-size:13px;resize:vertical;outline:0}

async function loadBig(lang){if(BST[lang]!=='idle')return;BST[lang]='loading';bankStatus();
  try{const r=await fetch('words-'+lang+'.txt');if(!r.ok)throw new Error(r.status);const txt=await r.text();
    const L={all:[],allB:[],n:[],nB:[],a:[],aB:[],v:[],vB:[]},lines=txt.split('\n'),tot=lines.length;
    for(let i=0;i<tot;i++){const ln=lines[i];if(!ln)continue;const c=ln.indexOf(':'),w=c<0?ln:ln.slice(0,c),f=c<0?'':ln.slice(c+1),b=f.includes('b');
      L.all.push(w);if(b)L.allB.push(w);if(f.includes('n')){L.n.push(w);if(b)L.nB.push(w)}if(f.includes('a')){L.a.push(w);if(b)L.aB.push(w)}if(f.includes('v')){L.v.push(w);if(b)L.vB.push(w)}

function pool(lang,pos,mn,mx){const forms=S.set.words.forms||'base',big=BIG[lang],key=lang+pos+mn+'-'+mx+forms+(big?'B':'');let p=POOLS.get(key);
  if(!p){let src;if(big){const k=(pos==='any'?'all':pos)+(forms==='base'?'B':'');src=big[k];if(!src||src.length<50)src=big[pos==='any'?'all':pos]||big.all}
    else src=pos==='any'?[...W[lang].n,...W[lang].a,...W[lang].v]:W[lang][pos];

  const k=rar==='common'?Math.pow(R(),3.2):rar==='deep'?.3+.7*R():Math.pow(R(),1.9);return p[Math.min(p.length-1,Math.floor(k*p.length))]}

/* ---------- platforms ---------- */
const PLAT={

};
const TIPS={any:'Pick a platform up top to apply its username rules. Every tile is checked against them.',

const SEMIP={4:['CVCV','CVCV','VCVC','CVVC','CVCC'],5:['CVCVC','CVCVC','CVCCV','VCVCV','CVVCV'],6:['CVCVCV','CVCVCV','CVCCVC','CVCVCC']};
function fromPat(p,lang,hard){let s='';for(const ch of p){
  if(ch==='C')s+=cpick();else if(ch==='V')s+=pick(VOW);else if(ch==='L')s+=pick(LET);else if(ch==='N')s+=pick(DIG);else if(ch==='X')s+=pick(LET+DIG);
  else if('WAOB'.includes(ch)){const pos={W:'any',A:'a',O:'n',B:'v'}[ch],w=pickWord(lang==='mix'?pick(['en','fr']):lang,pos,3,7,hard);if(!w)return null;s+=w}
  else if(/[a-z0-9._-]/.test(ch))s+=ch;}return s}
const GEN={
 words(o,hard){const lang=o.lang==='mix'?pick(['en','fr']):o.lang,sep=o.sep;let type=o.type;if(type==='mix')type=pick(['single','an','nn','vn']);if(hard&&o.type==='mix'&&R()<.6)type=pick(['an','nn','vn']);

  else{const ps={an:['a','n'],nn:['n','n'],vn:['v','n']}[type];let order=ps;if(lang==='fr'&&type==='an')order=['n','a'];
   const a=pickWord(lang,order[0],3,Math.max(3,o.max-3-sep.length),hard,1);if(!a)return null;const rest=o.max-a.length-sep.length;if(rest<3)return null;
   const b=pickWord(lang,order[1],3,rest,hard,1);if(!b||b===a)return null;u=a+sep+b}
  if(o.affix&&(R()<.55||hard)){const f=pick(AFF[lang]);u=R()<.75?f+(sep||'')+u:u+(sep||'')+f}
  if(o.num){u+=pick([String(ri(1,9)),String(ri(10,99)),pick(['00','01','07','11','13','22','23','69','77','88','99','x'])])}
  if(u.length<o.min||u.length>o.max)return null;return {u,meta:{lang}}},
 heads(o,hard){const set=o.set==='classic'?'xoeuqvtnwcy0':LET+(o.digits?DIG:'');const e1=pick(set),e2=o.eyes==='same'?e1:pick(set);if(o.eyes==='mixed'&&e1===e2)return null;
  const m=o.mouth==='mix'?pick(['_','.']):o.mouth;let size=o.size;if(hard&&size<5&&R()<.4)size++;
  let u;if(size===3)u=e1+m+e2;else if(size===4)u=e1+m+m+e2;else u=R()<.5?m+e1+m+e2+m:e1+m+e2+m+(o.eyes==='same'?e1:pick(set));return {u,meta:{head:1}}},
 nl(o,hard){const st=strip(o.start||'').slice(0,o.len),n=o.len-st.length;let s=st;

 rep(o,hard){const L=o.len,cs=o.cs==='letters'?LET:o.cs==='digits'?DIG:LET+DIG;let u='';const a=pick(cs);let b=pick(cs);while(b===a&&cs.length>1)b=pick(cs);let c=pick(cs);

const TIERS=[['lg','Legendary',90],['ep','Epic',74],['ra','Rare',58],['un','Uncommon',42],['co','Common',0]];

const LBASE=[0,100,93,84,72,58,46,36,28,22,18,15,12];

function split2(c){for(let i=3;i<=c.length-3;i++){const a=c.slice(0,i),b=c.slice(i);if(goodPart(a)&&goodPart(b))return [a,b]}return null}
function analyze(u,meta={}){
  const core=u.replace(/[._-]/g,''),L=u.length,cl=core.length,seps=L-cl,tags=[],why=[];let s;
  if(isHead(u)){const eyes=u.replace(/[._]/g,''),same=eyes[0]===eyes[eyes.length-1];s=L===3?(same?92:80):L===4?(same?76:66):(same?66:56);why.push([`${L}-character head`,s]);if(same){tags.push('head')}else tags.push('mixed head');if(/\d/.test(eyes)){s-=6;why.push(['digit eyes',-6])}}
  else{
    s=LBASE[Math.min(cl,12)]||10;if(cl>12)s=Math.max(6,12-(cl-12));why.push([`${cl} characters`,s]);
    const letters=/^[a-z]+$/.test(core),digits=/^\d+$/.test(core);
    if(letters&&cl<=5)tags.push(cl+'L');else if(digits){tags.push(cl+'N');const b=cl<=3?2:-4;s+=b;why.push(['numbers only',b])}else if(!letters){s-=10;why.push(['letters and numbers mixed',-10]);if(cl<=5)tags.push(cl+'C')}
    const d=wordInfo(core);
    if(d){const b=d.r<.03?30:d.r<.15?24:d.r<.5?18:12;s+=b;tags.unshift(d.lang==='fr'?'FR word':'word');why.push([d.r<.03?'very common word':d.r<.15?'common word':d.r<.5?'real word':'rare real word',b])}
    else{const sp=split2(core);if(sp){const b=cl<=8?14:9;s+=b;tags.push('combo');why.push(['two real words',b])}}
    if(cl>1&&/^(.)\1+$/.test(core)){s+=30;tags.push('rep');why.push(['one character repeated',30])}
    else if(cl>=4&&/^(.{2,3})\1+$/.test(core)){s+=16;tags.push('rep');why.push(['repeating pattern',16])}
    else if(cl>=3&&core===[...core].reverse().join('')){s+=10;tags.push('mirror');why.push(['palindrome',10])}

  return {u,s,tier,tags:[...new Set(tags)],why,free,lang:meta.lang||''};
}

  copy(atp(u));t.classList.remove('cp');void t.offsetWidth;t.classList.add('cp');vib(8)});
let lp=0;$('#grid').addEventListener('contextmenu',e=>{const t=e.target.closest('.tile');if(!t)return;e.preventDefault();detail(RES.find(r=>r.u===t.dataset.u))});
$('#grid').addEventListener('pointerdown',e=>{if(lp===-1)lp=0;const t=e.target.closest('.tile');if(!t||e.target.closest('button'))return;clearTimeout(lp);lp=setTimeout(()=>{lp=-1;detail(RES.find(r=>r.u===t.dataset.u))},480)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#grid').addEventListener(ev,()=>{if(lp!==-1)clearTimeout(lp)},true));
$('#grid').addEventListener('click',e=>{if(lp===-1){e.stopImmediatePropagation();lp=0}},true);
$('#grid').addEventListener('keydown',e=>{const t=e.target.closest('.tile');if(!t)return;if(e.key==='Enter'){copy(atp(t.dataset.u));toast('Copied '+atp(t.dataset.u))}else if(e.key==='i'){detail(RES.find(r=>r.u===t.dataset.u))}});
function toggleSave(x,btn){if(VSET.has(x.u)){S.v=S.v.filter(v=>v.u!==x.u);VSET.delete(x.u);btn&&btn.classList.remove('on');toast('Removed from vault')}else{const it={u:x.u,s:x.s,tier:x.tier,tags:x.tags,free:x.free,lang:x.lang,mode:S.set.mode,plat:S.set.plat,st:'idea',t:Date.now()};S.v.unshift(it);VSET.set(x.u,it);btn&&btn.classList.add('on');toast('Saved '+x.u);vib(10)}persist();counts();syncStars(x.u)}
function syncStars(u){$$(`.tile[data-u="${CSS.escape(u)}"] .sv`).forEach(b=>b.classList.toggle('on',VSET.has(u)))}
$('#copyall').onclick=()=>{if(!RES.length){toast('Generate some handles first');return}copy(RES.map(x=>atp(x.u)).join('\n'));toast(`Copied ${RES.length} handles`)};
$('#saveall').onclick=()=>{let n=0;for(const x of RES)if(!VSET.has(x.u)){const it={u:x.u,s:x.s,tier:x.tier,tags:x.tags,free:x.free,lang:x.lang,mode:S.set.mode,plat:S.set.plat,st:'idea',t:Date.now()};S.v.unshift(it);VSET.set(x.u,it);n++}persist();counts();$$('#grid .sv').forEach(b=>b.classList.add('on'));toast(`Saved ${n} new handles`)};
$('#sortb').onclick=()=>{S.set.sort=S.set.sort?0:1;persist();$('#sortb').classList.toggle('on',!!S.set.sort);$('#sortb').setAttribute('aria-pressed',S.set.sort?'true':'false');if(S.set.sort){RES.sort((a,b)=>b.s-a.s)}$('#grid').innerHTML=RES.map(tileHTML).join('')};
$('#gen1').onclick=$('#gen2').onclick=()=>{vib(10);if(view!=='gen')setView('gen');regen()};
$('#plat').innerHTML=Object.entries(PLAT).map(([k,p])=>`<option value="${k}">${p.n}</option>`).join('');
$('#plat').onchange=e=>{S.set.plat=e.target.value;persist();renderTip();if(view==='vault')renderVault();else regen()};

/* ---------- detail sheet ---------- */
function detail(x){if(!x)return;const saved=VSET.get(x.u);
  const plats=Object.entries(PLAT).filter(([k])=>k!=='any').map(([k,p])=>{const ok=p.test(x.u);return p.url&&ok?`<a class="pc" href="${p.url}${encodeURIComponent(x.u)}" target="_blank" rel="noopener">${p.n}<em class="ok">Check ↗</em></a>`:`<span class="pc">${p.n}<em class="${ok?'ok':'no'}">${ok?'✓ fits':'✗ rules'}</em></span>`}).join('');
  sheet(`<div class="t-${x.tier}"><div class="dh" style="color:var(--tc)">${esc(x.u)}</div>
   <div class="tm" style="margin-top:8px"><span class="tier">${TN[x.tier]} · ${x.s}/100</span>${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
   <div class="dsec"><div class="meter"><b style="width:${x.s}%"></b></div><div class="why">${x.why.map(([l,v])=>`<div><span>${esc(l)}</span><b>${v>0&&l.indexOf('characters')<0&&l.indexOf('head')<0?'+':''}${v}</b></div>`).join('')}</div></div>
   <div class="dsec"><span class="ol">Chance it's free · ${x.free}% · ${freeLbl(x.free)}</span><div class="meter" style="--tc:var(--acc)"><b style="width:${x.free}%"></b></div><p class="hint">An estimate from value, length and separators. It can't see who already owns it, so tap a platform below to check.</p></div>
   <div class="dsec"><span class="ol">Platforms</span><div class="pgrid">${plats}</div></div>
   ${saved?`<div class="dsec"><span class="ol">Status</span>${seg('dst',[['idea','Idea'],['avail','Available'],['claimed','Claimed'],['taken','Taken']],saved.st)}</div>`:''}
   <div class="acts"><button class="btn pri" id="dcp">Copy</button><button class="btn" id="dsv">${saved?'Remove from vault':'Save to vault'}</button></div></div>`,sh=>{
    $('#dcp',sh).onclick=()=>{copy(atp(x.u));toast('Copied '+atp(x.u))};
    $('#dsv',sh).onclick=()=>{toggleSave(x,null);closeSheet();if(view==='vault')renderVault()};
    const sg=$('[data-k=dst]',sh);if(sg)sg.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;saved.st=b.dataset.v;persist();$$('button',sg).forEach(y=>y.classList.toggle('on',y===b));if(view==='vault')renderVault()}})}

/* ---------- vault ---------- */
const STL={idea:'Idea',avail:'Available',claimed:'Claimed',taken:'Taken'},STO=['idea','avail','claimed','taken'];
const VF={q:'',tier:'all',st:'all',len:'all',sort:'new'};
const ago=t=>{const s=(Date.now()-t)/1000|0;return s<60?'just now':s<3600?(s/60|0)+'m ago':s<86400?(s/3600|0)+'h ago':(s/86400|0)+'d ago'};
function filtered(){let a=S.v.slice();const q=VF.q.trim().toLowerCase();
  if(q)a=a.filter(x=>x.u.includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q)));
  if(VF.tier!=='all')a=a.filter(x=>TORD[x.tier]<=TORD[VF.tier]);
  if(VF.st!=='all')a=a.filter(x=>x.st===VF.st);
  if(VF.len!=='all'){const [mn,mx]=VF.len.split('-').map(Number);a=a.filter(x=>x.u.length>=mn&&x.u.length<=mx)}
  if(S.set.plat!=='any'){const P=PLAT[S.set.plat];a=a.filter(x=>P.test(x.u))}
  const so={new:(x,y)=>y.t-x.t,old:(x,y)=>x.t-y.t,val:(x,y)=>y.s-x.s,short:(x,y)=>x.u.length-y.u.length||y.s-x.s,az:(x,y)=>x.u.localeCompare(y.u)}[VF.sort];return a.sort(so)}
let vLimit=300;
function renderVault(){const box=$('#vvault'),a=filtered(),byT=t=>S.v.filter(x=>x.tier===t).length;
  box.innerHTML=`<div class="vtool">
   <div class="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="vq" placeholder="Search saved handles or tags" value="${esc(VF.q)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
   <div class="vstats"><div class="vstat"><b>${S.v.length}</b><span>Saved</span></div><div class="vstat t-lg"><b style="color:var(--lg)">${byT('lg')}</b><span>Legendary</span></div><div class="vstat"><b style="color:var(--ep)">${byT('ep')}</b><span>Epic</span></div><div class="vstat"><b style="color:var(--ra)">${byT('ra')}</b><span>Rare</span></div><div class="vstat"><b style="color:var(--un)">${S.v.filter(x=>x.st==='avail').length}</b><span>Available</span></div><div class="vstat"><b style="color:var(--acc)">${S.v.filter(x=>x.st==='claimed').length}</b><span>Claimed</span></div></div>
   ${og('Tier',seg('ftier',[['all','All'],['lg','Legendary'],['ep','Epic+'],['ra','Rare+'],['un','Uncommon+']],VF.tier))}
   ${og('Status',seg('fst',[['all','All'],...STO.map(s=>[s,STL[s]])],VF.st))}
   <div class="row2">${og('Length',`<select class="sel" id="flen" style="max-width:none;width:100%">${[['all','Any'],['1-3','1–3'],['4-5','4–5'],['6-8','6–8'],['9-30','9+']].map(([v,l])=>`<option value="${v}" ${VF.len===v?'selected':''}>${l}</option>`).join('')}</select>`)}${og('Sort',`<select class="sel" id="fsort" style="max-width:none;width:100%">${[['new','Newest'],['old','Oldest'],['val','Value'],['short','Shortest'],['az','A–Z']].map(([v,l])=>`<option value="${v}" ${VF.sort===v?'selected':''}>${l}</option>`).join('')}</select>`)}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="vcp"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy ${a.length}</button><button class="btn" id="vexp">Backup</button><button class="btn" id="vimp">Import</button><button class="btn danger" id="vdel">Delete ${a.length===S.v.length?'all':a.length}</button></div>
   ${S.set.plat!=='any'?`<p class="hint">Showing handles that fit ${PLAT[S.set.plat].n}. Switch the platform to “Any platform” to see everything.</p>`:''}
  </div>
  ${a.length?`<div class="vlist">${a.slice(0,vLimit).map(x=>`<div class="vrow t-${x.tier}" data-u="${esc(x.u)}"><i></i><div class="vn" role="button" tabindex="0"><b>${esc(x.u)}</b><small>${TN[x.tier]} · ${x.s}/100 · ${(x.tags||[]).slice(0,2).map(esc).join(' · ')}${x.tags&&x.tags.length?' · ':''}${ago(x.t)}</small></div><button class="st st-${x.st}" data-a="st" aria-label="Change status">${STL[x.st]}</button><button class="ib" data-a="cp" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button><button class="ib" data-a="del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join('')}</div>${a.length>vLimit?`<div class="more"><button class="btn" id="vmore">Show ${Math.min(300,a.length-vLimit)} more</button></div>`:''}`:`<div class="empty"><b>${S.v.length?'No handles match these filters':'Your vault is empty'}</b>${S.v.length?'Clear the search or pick another filter.':'Tap the star on any handle to keep it here. Everything saves on this device automatically.'}</div>`}`;
  const q=$('#vq',box);q.oninput=()=>{VF.q=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{const p=q.selectionStart;renderVault();const n=$('#vq');n.focus();n.setSelectionRange(p,p)},180)};
  box.querySelectorAll('[data-k]').forEach(sg=>sg.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;if(sg.dataset.k==='ftier')VF.tier=b.dataset.v;else VF.st=b.dataset.v;vLimit=300;renderVault()});
  $('#flen',box).onchange=e=>{VF.len=e.target.value;renderVault()};$('#fsort',box).onchange=e=>{VF.sort=e.target.value;renderVault()};
  $('#vcp',box).onclick=()=>{if(!a.length){toast('Nothing to copy');return}copy(a.map(x=>atp(x.u)).join('\n'));toast(`Copied ${a.length} handles`)};
  $('#vexp',box).onclick=backupSheet;$('#vimp',box).onclick=importSheet;
  $('#vdel',box).onclick=()=>{if(!a.length)return;sheet(`<h3 style="font-size:19px">Delete ${a.length} handle${a.length===1?'':'s'}?</h3><p class="hint" style="margin-top:6px">This removes ${a.length===S.v.length?'everything in your vault':'the handles that match your filters'}. Make a backup first if you might want them back.</p><div class="acts"><button class="btn" id="dn">Cancel</button><button class="btn pri" id="dy" style="background:#e5484d;border-color:#e5484d">Delete</button></div>`,sh=>{$('#dn',sh).onclick=closeSheet;$('#dy',sh).onclick=()=>{const del=new Set(a.map(x=>x.u));S.v=S.v.filter(x=>!del.has(x.u));reindex();persist();counts();closeSheet();renderVault();toast('Deleted')}})};
  const vm=$('#vmore',box);if(vm)vm.onclick=()=>{vLimit+=300;renderVault()};
}
$('#vvault').addEventListener('click',e=>{const row=e.target.closest('.vrow');if(!row)return;const u=row.dataset.u,x=VSET.get(u);if(!x)return;const a=e.target.closest('[data-a]');
  if(a&&a.dataset.a==='st'){x.st=STO[(STO.indexOf(x.st)+1)%4];a.className='st st-'+x.st;a.textContent=STL[x.st];persist();vib(5);return}
  if(a&&a.dataset.a==='del'){S.v=S.v.filter(v=>v.u!==u);VSET.delete(u);persist();counts();row.remove();toast('Deleted '+u);return}
  if(a&&a.dataset.a==='cp'||e.target.closest('.vn')){copy(atp(u));row.classList.add('cp');setTimeout(()=>row.classList.remove('cp'),500);toast('Copied '+atp(u));vib(8)}});
$('#vvault').addEventListener('contextmenu',e=>{const row=e.target.closest('.vrow');if(!row)return;e.preventDefault();const x=VSET.get(row.dataset.u);detail({...analyze(x.u,{lang:x.lang}),...x})});
$('#vvault').addEventListener('dblclick',e=>{const row=e.target.closest('.vrow');if(!row)return;const x=VSET.get(row.dataset.u);detail({...analyze(x.u,{lang:x.lang}),...x})});
function backupSheet(){let code='';try{code='HF1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S.v))))}catch(e){}
  sheet(`<h3 style="font-size:19px">Back up your vault</h3><p class="hint" style="margin:6px 0 10px">Your vault lives on this device. Copy this code and paste it into Import on your other device to bring everything over, statuses included.</p><textarea class="ta" id="bc" readonly aria-label="Backup code">${code}</textarea><div class="acts"><button class="btn pri" id="bcp">Copy backup code</button><button class="btn" id="bdl">Download .txt</button></div>`,sh=>{
   $('#bcp',sh).onclick=()=>{if(copy(code)!==false)toast('Backup code copied');else{const t=$('#bc',sh);t.focus();t.select()}};
   $('#bdl',sh).onclick=async()=>{const txt=S.v.map(x=>x.u).join('\n');if(window.claude&&window.claude.use){try{const d=await window.claude.use('downloads');if(d){await d.save({filename:'handles.txt',data:new Blob([txt],{type:'text/plain'})});return}}catch(e){if(e&&e.code==='declined')return}}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([S.v.map(x=>x.u).join('\n')],{type:'text/plain'}));a.download='handles.txt';document.body.append(a);a.click();a.remove();toast('Download started')}catch(e){toast('Downloads are blocked here. Use the copy button.')}}})}
function importSheet(){sheet(`<h3 style="font-size:19px">Import handles</h3><p class="hint" style="margin:6px 0 10px">Paste a backup code, or any list of usernames, one per line or separated by spaces. Each one gets a value score.</p><textarea class="ta" id="ic" placeholder="HF1:… or a list like&#10;zavo&#10;x_x&#10;nightwolf" aria-label="Paste handles"></textarea><div class="acts"><button class="btn" id="icn">Cancel</button><button class="btn pri" id="icy">Import</button></div>`,sh=>{
  $('#icn',sh).onclick=closeSheet;
  $('#icy',sh).onclick=()=>{const v=$('#ic',sh).value.trim();let n=0;if(!v)return;
   if(v.startsWith('HF1:')){try{const arr=JSON.parse(decodeURIComponent(escape(atob(v.slice(4)))));for(const it of arr)if(it&&it.u&&!VSET.has(it.u)){S.v.push(it);VSET.set(it.u,it);n++}}catch(e){toast('That backup code is not valid');return}}
   else{for(const raw of v.split(/[\s,;]+/)){const u=raw.replace(/^@/,'').toLowerCase().replace(/[^a-z0-9._-]/g,'');if(u&&!VSET.has(u)){const x=analyze(u,{});const it={u,s:x.s,tier:x.tier,tags:x.tags,free:x.free,lang:'',mode:'import',plat:'any',st:'idea',t:Date.now()};S.v.unshift(it);VSET.set(u,it);n++}}}
   persist();counts();closeSheet();renderVault();toast(`Imported ${n} handle${n===1?'':'s'}`)}})}
function counts(){$('#vc1').textContent=$('#vc2').textContent=S.v.length}

/* ---------- views ---------- */
let view='gen';
function setView(v){view=v;$('#app').dataset.view=v;$('#vgen').hidden=v!=='gen';$('#vvault').hidden=v!=='vault';$$('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='vault'){vLimit=300;renderVault()}window.scrollTo(0,0);try{history.replaceState(null,'',v==='vault'?'#vault':location.pathname+location.search)}catch(e){}}
$$('[data-view]').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.view);vib(6)}));
addEventListener('hashchange',()=>setView(location.hash==='#vault'?'vault':'gen'));

/* ---------- boot ---------- */
const mq=matchMedia('(min-width:920px)');const syncOpen=()=>{$('#opts').open=mq.matches?true:$('#opts').open};
if(!mq.matches)$('#opts').open=false;mq.addEventListener?mq.addEventListener('change',syncOpen):0;
$('#plat').value=S.set.plat;$('#sortb').classList.toggle('on',!!S.set.sort);
renderModes();renderOpts();renderTip();counts();
histLoad().then(()=>{renderOpts();regen();Promise.all([loadBig('en'),loadBig('fr')]).then(()=>{if(S.set.mode==='words'||S.set.mode==='pat'){regen();toast('Full word banks loaded')}})});
if(location.hash==='#vault')setView('vault');
})();
</script>

</body>
</html>
